<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>מה מצבינו - תקציב</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/static/style.css">
</head>

<body>
<div class="app-shell">

  <header class="app-header">
    <h1 class="app-title">תקציב חודשי</h1>
    <p class="app-subtitle">קביעת תקציב לכל קטגוריה</p>
  </header>

  <div class="content">

    <a class="btn-main" href="{{ url_for('index') }}">חזרה לרשימת ההוצאות</a>

    <form class="form-box" method="post">
  <input type="hidden" name="month" value="{{ month }}">

  {% for row in budgets %}
    <div class="budget-row">
      <label>{{ row.category }}</label>
      <div style="display:flex; gap:8px; align-items:center;">
        <span>ש"ח</span>
        <input
          type="number"
          step="0.01"
          name="budget_{{ row.category }}"
          value="{{ row.amount }}"
        >
      </div>
    </div>
  {% endfor %}

  <button class="btn-main" type="submit">שמור תקציב</button>
  <a class="btn-main" href="{{ url_for('index') }}">חזרה לרשימת ההוצאות</a>
</form>

  </div>
</div>
</body>
</html>
