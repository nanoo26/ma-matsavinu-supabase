<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>מה מצבינו - הוספת הוצאה</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="app-shell">

    <!-- כותרת עליונה -->
    <header class="app-header">
      <h1 class="app-title">מה מצבינו</h1>
      <p class="app-subtitle">מעקב הוצאות משפחתי</p>

      <!-- ניווט ראשי - שורה אחת לכל האפליקציה -->
      <nav class="segmented-nav">
        <a href="{{ url_for('budget') }}"
           class="segmented-tab {% if active_tab == 'budget' %}is-active{% endif %}">
          🏅 <span>תקציב</span>
        </a>
        <a href="{{ url_for('reports') }}"
           class="segmented-tab {% if active_tab == 'reports' %}is-active{% endif %}">
          📊 <span>דוחות</span>
        </a>
        <a href="{{ url_for('expenses') }}"
           class="segmented-tab {% if active_tab == 'expenses' %}is-active{% endif %}">
          🧾 <span>הוצאות</span>
        </a>
      </nav>
    </header>

    <main class="content">
      {% if error_message %}
        <div class="alert-error">
          {{ error_message }}
        </div>
      {% endif %}

      <!-- טופס הוספת הוצאה -->
      <form action="{{ url_for('add_expense') }}" method="post" class="form-card">

        <!-- סוג הוצאה -->
        <div class="form-group">
          <label for="expense_type">סוג הוצאה</label>
          <select name="expense_type" id="expense_type">
            <option value="single">חד פעמית</option>
            <option value="standing">הוראת קבע חודשית</option>
            <option value="installments">רכישה בתשלומים</option>
          </select>
        </div>

        <div class="form-group">
          <label for="date">תאריך</label>
          <input
            type="date"
            id="date"
            name="date"
            value="{{ today }}"
            required>
        </div>

        <div class="form-group">
          <label for="category">קטגוריה</label>
          <select id="category" name="category" required>
            <option value="" disabled selected>בחר קטגוריה</option>
            {% for c in categories %}
              <option value="{{ c }}">{{ c }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="form-group">
          <label for="amount">סכום (₪)</label>
          <input
            type="number"
            id="amount"
            name="amount"
            step="0.01"
            min="0"
            required>
        </div>

        <div class="form-group">
          <label for="payment_method">אמצעי תשלום</label>
          <select id="payment_method" name="payment_method" required>
            <option value="" disabled selected>בחר אמצעי תשלום</option>
            {% for p in payment_methods %}
              <option value="{{ p }}">{{ p }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="form-group">
          <label for="notes">הערות</label>
          <textarea
            id="notes"
            name="notes"
            rows="2"
            placeholder="הערות (לא חובה)"></textarea>
        </div>

        <button type="submit" class="btn-primary full-width">
          שמירת הוצאה
        </button>
      </form>

      <div class="bottom-links">
        <a href="{{ url_for('expenses') }}" class="link-back">
          ← חזרה לרשימת ההוצאות
        </a>
      </div>
    </main>
  </div>
</body>
</html>
