<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>מה מצבינו - הוספת הוצאה</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="app-shell">

    <!-- כותרת עליונה -->
    <header class="app-header">
      <h1 class="app-title">מה מצבינו</h1>
      <p class="app-subtitle">הוספת הוצאה חדשה</p>

      {% include "tabs.html" %}
    </header>

    <main class="content">

      {% if error_message %}
        <section class="card">
          <div class="card-body">
            <div class="alert-error">
              {{ error_message }}
            </div>
          </div>
        </section>
      {% endif %}

      <!-- כרטיס הוספת הוצאה -->
      <section class="card add-expense-card">
        <div class="card-header">
          <h2 class="card-title">✏️ הוספת הוצאה</h2>
          <p class="card-subtitle">מלא את הפרטים הבאים והוסף הוצאה חדשה למעקב</p>
        </div>

        <div class="card-body">
          <!-- טופס הוספת הוצאה -->
          <form action="{{ url_for('add_expense') }}" method="post" class="expense-form">

            <!-- סוג הוצאה -->
            <div class="form-group">
              <label for="expense_type">סוג הוצאה</label>
              <select id="expense_type" name="expense_type" class="input">
                <option value="">בחר סוג הוצאה</option>
                <option value="single">רכישה חד פעמית</option>
                <option value="standing">הוצאה קבועה (הוראת קבע)</option>
                <option value="installments">רכישה בתשלומים</option>
              </select>
            </div>

            <!-- הוצאה קבועה (צ׳קבוקס יחיד) -->
            <div class="form-group">
              <label class="checkbox-label">
                <input type="checkbox" id="is_fixed" name="is_fixed" value="1">
                <span>הוצאה קבועה (תשלום חוזר / הוראת קבע)</span>
              </label>
            </div>

            <!-- חלונית תשלומים קטנה -->
            <div id="installments-panel" class="installments-panel installments-panel-hidden">
              <div class="installments-header">
                <span class="installments-title">תשלומים</span>
                <span class="installments-chip">רכישה בתשלומים</span>
              </div>

              <label for="installments_count">מספר תשלומים</label>
              <input
                type="number"
                id="installments_count"
                name="installments_count"
                min="1"
                max="60"
                value="1"
              >
              <p class="installments-hint">
                סכום לחיוב חודשי יחושב מתוך הסכום הכולל.
              </p>
            </div>

            <!-- תאריך -->
            <div class="form-group">
              <label for="date">תאריך</label>
              <input
                type="date"
                id="date"
                name="date"
                value="{{ today }}"
                required
              >
            </div>

            <!-- קטגוריה -->
            <div class="form-group">
              <label for="category">קטגוריה</label>
              <select id="category" name="category" required>
                <option value="" disabled selected>בחר קטגוריה</option>
                {% for c in categories %}
                  <option value="{{ c }}">{{ c }}</option>
                {% endfor %}
              </select>
            </div>

            <!-- סכום -->
            <div class="form-group">
              <label for="amount">סכום (₪)</label>
              <input
                type="number"
                id="amount"
                name="amount"
                step="0.01"
                min="0"
                required
                placeholder="לדוגמה: 150.00"
              >
            </div>

            <!-- אמצעי תשלום -->
            <div class="form-group">
              <label for="payment_method">אמצעי תשלום</label>
              <select id="payment_method" name="payment_method" required>
                <option value="" disabled selected>בחר אמצעי תשלום</option>
                {% for p in payment_methods %}
                  <option value="{{ p }}">{{ p }}</option>
                {% endfor %}
              </select>
            </div>

            <!-- הערות -->
            <div class="form-group">
              <label for="note">הערות</label>
              <textarea
                id="note"
                name="note"
                rows="2"
                placeholder="הערות (לא חובה)"
              ></textarea>
            </div>

            <!-- כפתור שמירה -->
            <button type="submit" class="btn-main full-width">
              💾 שמירת הוצאה
            </button>
          </form>
        </div>
      </section>

      <div class="bottom-links">
        <a href="{{ url_for('expenses') }}" class="link-back">
          ← חזרה לרשימת ההוצאות
        </a>
      </div>
    </main>
  </div>

  <!-- לוגיקה עבור תשלומים + צ׳קבוקס -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const typeSelect = document.getElementById("expense_type");
      const panel = document.getElementById("installments-panel");
      const installmentsInput = document.getElementById("installments_count");
      const fixedCheckbox = document.getElementById("is_fixed");

      function applyTypeLogic() {
        if (!typeSelect) return;
        const v = (typeSelect.value || "").trim();

        // 1. תצוגת חלונית תשלומים
        const isInstallments = v === "installments";
        if (panel && installmentsInput) {
          panel.style.display = isInstallments ? "block" : "none";
          installmentsInput.required = isInstallments;
          if (isInstallments) {
            if (!installmentsInput.value || parseInt(installmentsInput.value, 10) < 1) {
              installmentsInput.value = 1;
            }
          }
        }

        // 2. הוצאה קבועה / תשלומים - צ׳קבוקס
        if (!fixedCheckbox) return;

        if (v === "standing") {
          // הוראת קבע - מסומן וננעל
          fixedCheckbox.checked = true;
          fixedCheckbox.disabled = true;
        } else if (v === "installments") {
          // תשלומים - יורד אוטומטית, אפשר לשנות
          fixedCheckbox.checked = false;
          fixedCheckbox.disabled = false;
        } else {
          // חד פעמי / ריק - חופשי
          fixedCheckbox.disabled = false;
        }
      }

      if (typeSelect) {
        typeSelect.addEventListener("change", applyTypeLogic);
        typeSelect.addEventListener("input", applyTypeLogic);
      }

      // מצב התחלתי
      applyTypeLogic();
    });
  </script>
</body>
</html>
