<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>מה מצבינו - הוספת הוצאה</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="app-shell">

    <!-- כותרת עליונה -->
    <header class="app-header">
      <h1 class="app-title">מה מצבינו</h1>
      <p class="app-subtitle">הוספת הוצאה</p>

      {% include "tabs.html" %}
    </header>

    <main class="content">
      {% if error_message %}
        <div class="alert-error">
          {{ error_message }}
        </div>
      {% endif %}

      <!-- טופס הוספת הוצאה -->
      <form action="{{ url_for('add_expense') }}" method="post" class="form-card">

        <!-- סוג הוצאה -->
        <div class="form-group">
          <label for="expense_type">סוג הוצאה</label>
          <select name="expense_type" id="expense_type">
            <option value="חד פעמית">חד פעמית</option>
            <option value="הוראת קבע חודשית">הוראת קבע חודשית</option>
            <option value="רכישה בתשלומים">רכישה בתשלומים</option>
          </select>
        </div>

        <!-- תאריך -->
        <div class="form-group">
          <label for="date">תאריך</label>
          <input
            type="date"
            id="date"
            name="date"
            value="{{ today }}"
            required>
        </div>

        <!-- קטגוריה -->
        <div class="form-group">
          <label for="category">קטגוריה</label>
          <select id="category" name="category" required>
            <option value="" disabled selected>בחר קטגוריה</option>
            {% for c in categories %}
              <option value="{{ c }}">{{ c }}</option>
            {% endfor %}
          </select>
        </div>

        <!-- סכום -->
        <div class="form-group">
          <label for="amount">סכום (₪)</label>
          <input
            type="number"
            id="amount"
            name="amount"
            step="0.01"
            min="0"
            required>
        </div>

        <!-- אמצעי תשלום -->
        <div class="form-group">
          <label for="payment_method">אמצעי תשלום</label>
          <select id="payment_method" name="payment_method" required>
            <option value="" disabled selected>בחר אמצעי תשלום</option>
            {% for p in payment_methods %}
              <option value="{{ p }}">{{ p }}</option>
            {% endfor %}
          </select>
        </div>

        <!-- הערות -->
        <div class="form-group">
          <label for="note">הערות</label>
          <textarea
            id="note"
            name="note"
            rows="2"
            placeholder="הערות (לא חובה)"></textarea>
        </div>

        <!-- הוצאה קבועה -->
        <div class="form-group checkbox-group">
          <label for="is_fixed">
            <input type="checkbox" id="is_fixed" name="is_fixed" value="1">
            הוצאה קבועה (תשלום חוזר / הוראת קבע)
          </label>
        </div>

        <!-- כפתור שמירה -->
        <button type="submit" class="btn-primary full-width">
          שמירת הוצאה
        </button>
      </form>

      <div class="bottom-links">
        <a href="{{ url_for('expenses') }}" class="link-back">
          ← חזרה לרשימת ההוצאות
        </a>
      </div>
    </main>
  </div>
</body>
</html>
