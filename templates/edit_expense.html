<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>עריכת הוצאה</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/static/style.css">
</head>

<body>
<div class="app-shell">
  <header class="app-header">
    <h1 class="app-title">עריכת הוצאה</h1>
  </header>

  <form class="form-box" method="post">

    <label>תאריך:</label>
    <input type="date" name="date" value="{{ date_for_input(expense['date']) }}" required>

    <label>קטגוריה:</label>
    <select name="category" required>
      {% for c in categories %}
      <option value="{{ c }}" {% if c == expense['category'] %}selected{% endif %}>{{ c }}</option>
      {% endfor %}
    </select>

    <label>סכום:</label>
    <input type="number" step="0.01" name="amount" value="{{ expense['amount'] }}" required>

    <label>אמצעי תשלום:</label>
    <select name="payment_method">
      {% set pm = expense['payment_method'] %}
      <option {% if pm == "מקס שלום" %}selected{% endif %}>מקס שלום</option>
      <option {% if pm == "מקס חגית" %}selected{% endif %}>מקס חגית</option>
      <option {% if pm == "כאל ויזה" %}selected{% endif %}>כאל ויזה</option>
      <option {% if pm == "לאומי שלום" %}selected{% endif %}>לאומי שלום</option>
      <option {% if pm == "עו\"ש" %}selected{% endif %}>עו"ש</option>
    </select>

    <label>הערות:</label>
    <input type="text" name="description" value="{{ expense['description'] }}">

    <button class="btn-main" type="submit">עדכן</button>
  </form>
</div>
</body>
</html>
