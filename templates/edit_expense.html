<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>מה מצבינו - עריכת הוצאה</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="app-shell">

    <!-- כותרת עליונה -->
    <header class="app-header">
      <h1 class="app-title">מה מצבינו</h1>
      <p class="app-subtitle">עריכת הוצאה</p>

      {% include "tabs.html" %}
    </header>

    <main class="content">

      <section class="form-box">
        <form method="post">
          <!-- שדה חבוי לחזרה לעמוד הקודם (דוחות או מה שלא יהיה) -->
          <input type="hidden" name="next" value="{{ request.args.get('next') or request.referrer or '' }}">

          <!-- תאריך -->
          <label for="date">תאריך</label>
          <input
            type="date"
            id="date"
            name="date"
            required
            value="{{ expense.date_for_input }}"
          >

          <!-- קטגוריה -->
          <label for="category">קטגוריה</label>
          <select id="category" name="category" required>
            <option value="">בחר קטגוריה</option>
            {% for cat in categories %}
              <option value="{{ cat }}" {% if expense.category == cat %}selected{% endif %}>
                {{ cat }}
              </option>
            {% endfor %}
          </select>

          <!-- סכום -->
          <label for="amount">סכום</label>
          <input
            type="number"
            id="amount"
            name="amount"
            step="1"
            min="0"
            required
            value="{{ expense.amount }}"
          >

          <!-- אמצעי תשלום -->
          <label for="payment_method">אמצעי תשלום</label>
          <select id="payment_method" name="payment_method" required>
            <option value="">בחר אמצעי תשלום</option>
            {% for pm in payment_methods %}
              <option value="{{ pm }}" {% if expense.payment_method == pm %}selected{% endif %}>
                {{ pm }}
              </option>
            {% endfor %}
          </select>

          <!-- סוג הוצאה -->
          <div class="form-group">
            <label for="expense_type">סוג הוצאה</label>
            <select id="expense_type" name="expense_type" class="input">
              <option value="">בחר סוג הוצאה</option>

              <option value="single"
                {% if expense.expense_type == 'single' %}
                  selected
                {% endif %}
              >
                רכישה חד פעמית
              </option>

              <option value="standing"
                {% if expense.expense_type == 'standing' %}
                  selected
                {% endif %}
              >
                הוצאה קבועה (הוראת קבע)
              </option>

              <option value="installments"
                {% if expense.expense_type == 'installments' %}
                  selected
                {% endif %}
              >
                רכישה בתשלומים
              </option>
            </select>
          </div>

          <!-- חלונית תשלומים קטנה -->
          <div
            id="installments-panel"
            class="installments-panel {% if expense.expense_type == 'installments' %}installments-panel-visible{% else %}installments-panel-hidden{% endif %}"
          >
            <div class="installments-header">
              <span class="installments-title">תשלומים</span>
              <span class="installments-chip">
                {% if expense.installments_count and expense.installments_count > 1 %}
                  {{ expense.installments_count }} תשלומים
                {% else %}
                  הגדרת תשלומים
                {% endif %}
              </span>
            </div>

            <label for="installments_count">מספר תשלומים</label>
            <input
              type="number"
              id="installments_count"
              name="installments_count"
              min="1"
              max="60"
              value="{{ expense.installments_count or 1 }}"
            >
            <p class="installments-hint">
              ניתן לעדכן את מספר התשלומים במקרה של טעות בהגדרה.
            </p>
          </div>

          <!-- הוצאה קבועה (V) -->
          <div class="form-group">
            <label class="checkbox-label">
              <input
                type="checkbox"
                id="is_fixed"
                name="is_fixed"
                value="1"
                {% if expense.is_fixed or expense.expense_type == 'standing' %}
                  checked
                {% endif %}
              >
              <span>הוצאה קבועה (תשלום חוזר / הוראת קבע)</span>
            </label>
          </div>

          <!-- הערות -->
          <label for="note">הערות</label>
          <textarea
            id="note"
            name="note"
            rows="2"
            class="form-textarea"
          >{{ expense.note or "" }}</textarea>

          <!-- כפתורים -->
          <div class="form-actions">
            <button type="submit" class="btn-small">
              💾 שמירת שינוי
            </button>
            <a href="{{ request.args.get('next') or request.referrer or url_for('expenses') }}"
               class="btn-small">
              ביטול
            </a>
          </div>
        </form>
      </section>
    </main>
  </div>

  <script>
    (function () {
      const typeSelect = document.getElementById("expense_type");
      const panel = document.getElementById("installments-panel");
      const installmentsInput = document.getElementById("installments_count");
      const fixedCheckbox = document.getElementById("is_fixed");

      function applyTypeLogic() {
        if (!typeSelect) return;
        const v = (typeSelect.value || "").trim();

        // תצוגת חלונית תשלומים
        const isInstallments = v === "installments";
        if (panel && installmentsInput) {
          panel.style.display = isInstallments ? "block" : "none";
          installmentsInput.required = isInstallments;
          if (isInstallments && (!installmentsInput.value || parseInt(installmentsInput.value, 10) < 1)) {
            installmentsInput.value = 1;
          }
        }

        // צ׳קבוקס הוצאה קבועה
        if (!fixedCheckbox) return;

        if (v === "standing") {
          fixedCheckbox.checked = true;
          fixedCheckbox.disabled = true;
        } else if (v === "installments") {
          fixedCheckbox.checked = false;
          fixedCheckbox.disabled = false;
        } else {
          fixedCheckbox.disabled = false;
        }
      }

      if (typeSelect) {
        typeSelect.addEventListener("change", applyTypeLogic);
        typeSelect.addEventListener("input", applyTypeLogic);
      }

      // מצב התחלתי לפי הנתונים מהשרת
      applyTypeLogic();
    })();
  </script>
</body>
</html>
