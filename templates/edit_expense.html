<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>עריכת הוצאה - מה מצבינו</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <h1 class="app-title">עריכת הוצאה</h1>
      <p class="app-subtitle">עדכון נתוני ההוצאה</p>
    </header>

    <main class="content">
      {% if error_message %}
        <div class="alert-error">
          {{ error_message }}
        </div>
      {% endif %}

      <form action="{{ url_for('edit_expense_view', expense_id=expense.id) }}"
            method="post"
            class="form-card">
        <div class="form-group">
          <label for="date">תאריך</label>
          <input
            type="date"
            id="date"
            name="date"
            value="{{ expense.date_for_input }}"
            required>
        </div>

        <div class="form-group">
          <label for="category">קטגוריה</label>
          <select id="category" name="category" required>
            {% for c in categories %}
              <option value="{{ c }}" {% if c == expense.category %}selected{% endif %}>
                {{ c }}
              </option>
            {% endfor %}
          </select>
        </div>

        <div class="form-group">
          <label for="amount">סכום (₪)</label>
          <input
            type="number"
            id="amount"
            name="amount"
            step="0.01"
            min="0"
            value="{{ "%.2f"|format(expense.amount) }}"
            required>
        </div>

        <div class="form-group">
          <label for="payment_method">אמצעי תשלום</label>
          <select id="payment_method" name="payment_method" required>
            {% for p in payment_methods %}
              <option value="{{ p }}" {% if p == expense.payment_method %}selected{% endif %}>
                {{ p }}
              </option>
            {% endfor %}
          </select>
        </div>

        <div class="form-group">
          <label for="notes">הערות</label>
          <textarea
            id="notes"
            name="notes"
            rows="2"
          >{{ expense.notes }}</textarea>
        </div>

        <button type="submit" class="btn-primary full-width">
          שמירת שינויים
        </button>
      </form>

      <div class="bottom-links">
        <a href="{{ url_for('expenses') }}" class="link-back">
          ← חזרה לרשימת ההוצאות
        </a>
      </div>
    </main>
  </div>
</body>
</html>
