<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>מה מצבינו - עריכת הוצאה</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="app-shell">

    <!-- כותרת עליונה -->
    <header class="app-header">
      <h1 class="app-title">מה מצבינו</h1>
      <p class="app-subtitle">עריכת הוצאה</p>

      {% include "tabs.html" %}
    </header>

    <main class="content">

      <section class="form-box" style="background:#ffffff; margin:16px; border-radius:12px; box-shadow:0 1px 6px rgba(0,0,0,0.08);">
        <form method="post">

          <!-- תאריך -->
          <label for="date">תאריך</label>
          <input
            type="date"
            id="date"
            name="date"
            required
            value="{{ expense.date_for_input }}"
          >

          <!-- קטגוריה -->
          <label for="category">קטגוריה</label>
          <select id="category" name="category" required>
            <option value="">בחר קטגוריה</option>
            {% for cat in categories %}
              <option value="{{ cat }}" {% if expense.category == cat %}selected{% endif %}>
                {{ cat }}
              </option>
            {% endfor %}
          </select>

          <!-- סכום -->
          <label for="amount">סכום</label>
          <input
            type="number"
            id="amount"
            name="amount"
            step="0.01"
            min="0"
            required
            value="{{ expense.amount }}"
          >

          <!-- אמצעי תשלום -->
          <label for="payment_method">אמצעי תשלום</label>
          <select id="payment_method" name="payment_method" required>
            <option value="">בחר אמצעי תשלום</option>
            {% for pm in payment_methods %}
              <option value="{{ pm }}" {% if expense.payment_method == pm %}selected{% endif %}>
                {{ pm }}
              </option>
            {% endfor %}
          </select>

          <!-- סוג הוצאה -->
          <label for="expense_type">סוג הוצאה</label>
          <select id="expense_type" name="expense_type">
            <option value="">בחר סוג הוצאה</option>
            <option value="חד פעמית" {% if expense.expense_type == "חד פעמית" %}selected{% endif %}>
              חד פעמית
            </option>
            <option value="הוראת קבע חודשית" {% if expense.expense_type == "הוראת קבע חודשית" %}selected{% endif %}>
              הוראת קבע חודשית
            </option>
            <option value="רכישה בתשלומים" {% if expense.expense_type == "רכישה בתשלומים" %}selected{% endif %}>
              רכישה בתשלומים
            </option>
          </select>

          <!-- חלונית תשלומים קטנה -->
          <div id="installments-panel" class="installments-panel" style="display:none; margin-top:12px;">
            <div class="installments-header">
              <span class="installments-title">תשלומים</span>
              <span class="installments-chip">
                {% if expense.installments_count and expense.installments_count > 1 %}
                  {{ expense.installments_count }} תשלומים
                {% else %}
                  הגדרת תשלומים
                {% endif %}
              </span>
            </div>

            <label for="installments_count">מספר תשלומים</label>
            <input
              type="number"
              id="installments_count"
              name="installments_count"
              min="1"
              max="60"
              value="{{ expense.installments_count or 1 }}"
            >
            <p class="installments-hint">
              ניתן לעדכן את מספר התשלומים במקרה של טעות בהגדרה.
            </p>
          </div>

          <!-- הוצאה קבועה (V) -->
          <label style="display:flex; align-items:center; gap:8px; margin-top:12px; font-size:14px;">
            <input
              type="checkbox"
              name="is_fixed"
              value="1"
              style="width:auto; margin-top:0;"
              {% if expense.is_fixed %}checked{% endif %}
            >
            <span>הוצאה קבועה (תשלום חוזר / הוראת קבע)</span>
          </label>

          <!-- הערות -->
          <label for="note">הערות</label>
          <textarea
            id="note"
            name="note"
            rows="2"
            style="width:100%; padding:8px; margin-top:4px; border-radius:8px; border:1px solid #cbd5e1; font-size:15px;"
          >{{ expense.note or "" }}</textarea>

          <!-- כפתורים -->
          <div style="display:flex; gap:8px; margin-top:20px;">
            <button type="submit" class="btn-small" style="flex:1; border:none; cursor:pointer;">
              💾 שמירת שינוי
            </button>
            <a href="{{ url_for('expenses') }}" class="btn-small" style="flex:1; text-align:center;">
              ביטול
            </a>
          </div>

        </form>
      </section>
    </main>
  </div>

  <script>
    (function () {
      const typeSelect = document.getElementById("expense_type");
      const panel = document.getElementById("installments-panel");

      function updatePanel() {
        if (!typeSelect || !panel) return;
        if (typeSelect.value === "רכישה בתשלומים") {
          panel.style.display = "block";
        } else {
          panel.style.display = "none";
        }
      }

      if (typeSelect) {
        typeSelect.addEventListener("change", updatePanel);
        updatePanel();
      }
    })();
  </script>
</body>
</html>
