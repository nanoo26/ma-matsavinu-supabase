<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>מה מצבינו - עריכת הוצאה</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="app-shell">

    <!-- כותרת עליונה -->
    <header class="app-header">
      <h1 class="app-title">מה מצבינו</h1>
      <p class="app-subtitle">עריכת הוצאה</p>

      {% include "tabs.html" %}
    </header>

    <main class="content">

      {% if error_message %}
        <div class="alert-error">
          {{ error_message }}
        </div>
      {% endif %}

      <!-- טופס עריכת הוצאה - אותו סגנון כמו add_expense -->
      <form method="post" class="form-card">

        <!-- תאריך -->
        <div class="form-group">
          <label for="date">תאריך</label>
          <input
            type="date"
            id="date"
            name="date"
            required
            value="{{ expense.date_for_input }}"
          >
        </div>

        <!-- קטגוריה -->
        <div class="form-group">
          <label for="category">קטגוריה</label>
          <select id="category" name="category" required>
            <option value="">בחר קטגוריה</option>
            {% for cat in categories %}
              <option value="{{ cat }}" {% if expense.category == cat %}selected{% endif %}>
                {{ cat }}
              </option>
            {% endfor %}
          </select>
        </div>

        <!-- סכום -->
        <div class="form-group">
          <label for="amount">סכום (₪)</label>
          <input
            type="number"
            id="amount"
            name="amount"
            step="0.01"
            min="0"
            required
            value="{{ expense.amount }}"
          >
        </div>

        <!-- אמצעי תשלום -->
        <div class="form-group">
          <label for="payment_method">אמצעי תשלום</label>
          <select id="payment_method" name="payment_method" required>
            <option value="">בחר אמצעי תשלום</option>
            {% for pm in payment_methods %}
              <option value="{{ pm }}" {% if expense.payment_method == pm %}selected{% endif %}>
                {{ pm }}
              </option>
            {% endfor %}
          </select>
        </div>

        <!-- סוג הוצאה -->
        <div class="form-group">
          <label for="expense_type">סוג הוצאה</label>
          <select id="expense_type" name="expense_type">
            <option value="">בחר סוג הוצאה</option>
            <option value="חד פעמית" {% if expense.expense_type == "חד פעמית" %}selected{% endif %}>
              חד פעמית
            </option>
            <option value="הוראת קבע חודשית" {% if expense.expense_type == "הוראת קבע חודשית" %}selected{% endif %}>
              הוראת קבע חודשית
            </option>
            <option value="רכישה בתשלומים" {% if expense.expense_type == "רכישה בתשלומים" %}selected{% endif %}>
              רכישה בתשלומים
            </option>
          </select>
        </div>

        <!-- הוצאה קבועה (V) -->
        <div class="form-group checkbox-group">
          <label for="is_fixed">
            <input
              type="checkbox"
              id="is_fixed"
              name="is_fixed"
              value="1"
              {% if expense.is_fixed %}checked{% endif %}
            >
            הוצאה קבועה (תשלום חוזר / הוראת קבע)
          </label>
        </div>

        <!-- הערות -->
        <div class="form-group">
          <label for="note">הערות</label>
          <textarea
            id="note"
            name="note"
            rows="2"
            placeholder="הערות (לא חובה)"
          >{{ expense.note or "" }}</textarea>
        </div>

        <!-- כפתורים -->
        <div class="form-actions">
          <button type="submit" class="btn-primary full-width">
            💾 שמירת שינוי
          </button>

          <a href="{{ url_for('expenses') }}" class="link-back" style="margin-top:8px; display:block; text-align:center;">
            ביטול וחזרה לרשימת ההוצאות
          </a>
        </div>

      </form>
    </main>
  </div>
</body>
</html>
