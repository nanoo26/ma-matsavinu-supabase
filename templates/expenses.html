<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>מה מצבינו - הוצאות</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/static/style.css">
</head>

<body>
<div class="app-shell">

  <header class="app-header">
    <h1 class="app-title">מעקב הוצאות</h1>
    <p class="app-subtitle">כל ההוצאות במקום אחד</p>
  </header>

  <div class="content">

    <a class="btn-main" href="/add">הוספת הוצאה חדשה</a>
    <a class="btn-main" href="/budget">ניהול תקציב</a>

    <ul class="expense-list">
      {% for e in expenses %}
      <li class="expense-item">
        <div class="expense-row">
          <span class="exp-note">{{ e["description"] }}</span>
          <span class="exp-amount">{{ "%.2f"|format(e["amount"]) }} ש"ח</span>
        </div>

        <div class="exp-meta">
          
          <span class="exp-date">{{ e["date"] }}</span>
          
        </div>

        <div class="exp-actions">
          <a href="/edit/{{ e['id'] }}" class="btn-small edit-btn">ערוך</a>
          <a href="/delete/{{ e['id'] }}" class="btn-small delete-btn">מחק</a>
        </div>
      </li>
      {% endfor %}
    </ul>

  </div>
</div>
</body>
</html>
